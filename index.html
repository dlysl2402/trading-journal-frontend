<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,500&display=swap">
<style>
  /* One committed dark theme: warm near-black ground, hairlines, mono for
     every figure, serif for the one number the page leads with. Sage is the only
     accent; jade and coral mean profit and loss and nothing else. */
  :root {
    color-scheme: dark;
    --void: #0b0a09;
    --void-2: #080807;
    --surface: #121110;
    --surface-2: #1a1816;
    --ink: #f3efe8;
    --body: #cfc8bd;
    --dim: #9a938a;
    --faint: #6b655d;
    --hair: rgba(235, 220, 200, 0.12);
    --hair-2: rgba(235, 220, 200, 0.26);
    --gridline: rgba(235, 220, 200, 0.045);
    --accent: #bcd18f;
    --accent-hi: #dcecb2;
    --accent-ghost: rgba(188, 209, 143, 0.13);
    --accent-ink: #13160c;
    --series: var(--accent);
    --up: #45d68e;
    --up-ghost: rgba(69, 214, 142, 0.14);
    --down: #f56e5e;
    --down-ghost: rgba(245, 110, 94, 0.14);
    --warn: #f7b345;
    --cat-stop: #5b8def;
    --cat-target: #22c1c3;
    --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--void); scrollbar-color: var(--surface-2) var(--void); }
  body {
    margin: 0;
    padding: 28px 24px 72px;
    min-height: 100vh;
    background: var(--void);
    color: var(--body);
    font: 400 13px/1.5 var(--mono);
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  /* A faint grid behind everything, fading out down the page. */
  body::before {
    content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background-image:
      linear-gradient(var(--gridline) 1px, transparent 1px),
      linear-gradient(90deg, var(--gridline) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(ellipse 120% 90% at 50% 0%, #000 30%, transparent 78%);
    mask-image: radial-gradient(ellipse 120% 90% at 50% 0%, #000 30%, transparent 78%);
  }
  main { max-width: 1120px; margin: 0 auto; }

  header {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap;
    padding-bottom: 14px; border-bottom: 1px solid var(--hair); margin-bottom: 28px;
    font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
  }
  h1 { font: inherit; font-weight: 500; color: var(--ink); margin: 0; white-space: nowrap; }
  h1::before { content: ''; display: inline-block; width: 6px; height: 6px; background: var(--accent); margin-right: 10px; vertical-align: 1px; }
  .sub { color: var(--faint); margin: 0; }

  .tiles { display: grid; grid-template-columns: repeat(12, 1fr); gap: 1px; background: var(--hair); border: 1px solid var(--hair); margin-bottom: 16px; }
  .tile { grid-column: span 6; background: var(--void); padding: 18px 20px; min-width: 0; transition: background 0.25s; }
  .tile:hover { background: var(--surface); }
  .tile.hero { grid-column: span 12; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 26px 26px 22px; }
  @media (min-width: 720px) { .tile { grid-column: span 4; } }
  @media (min-width: 1000px) { .tile { grid-column: span 2; } }
  .label { font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--faint); }
  .value { font-size: 22px; font-weight: 500; color: var(--ink); margin-top: 10px; line-height: 1.1; letter-spacing: -0.01em; }
  .hero .value { font-family: var(--serif); font-size: 72px; letter-spacing: -0.02em; line-height: 1; margin-top: 14px; font-variant-numeric: proportional-nums; }
  .note { color: var(--dim); font-size: 11px; margin-top: 8px; line-height: 1.5; }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .warn { color: var(--warn); }
  .delta { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 30px; line-height: 1.1; letter-spacing: -0.01em; margin-top: 8px; color: var(--accent); font-variant-numeric: proportional-nums; }
  .delta.down { color: var(--down); }
  .delta.flat { color: var(--dim); }
  .readout { display: grid; grid-template-columns: auto auto; gap: 7px 20px; margin: 0; font-size: 11.5px; }
  .readout dt { font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--faint); align-self: baseline; }
  .readout dd { margin: 0; color: var(--body); text-align: right; }

  .card { background: var(--void); border: 1px solid var(--hair); padding: 20px 22px 18px; position: relative; }
  h2 { font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--faint); font-weight: 400; margin: 0 0 16px; }
  h2::before { content: ''; display: inline-block; width: 5px; height: 5px; background: var(--accent); margin-right: 9px; vertical-align: 1px; }
  .card.chart { padding: 20px 18px 14px; overflow: hidden; }
  .card.chart h2 { margin-left: 6px; }
  svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: none; }
  .grid line { stroke: var(--hair); stroke-width: 1; }
  .baseline { stroke: var(--hair-2); stroke-width: 1; }
  .tick { fill: var(--faint); font-size: 10px; font-family: var(--mono); letter-spacing: 0.04em; }
  .line { fill: none; stroke: var(--accent); stroke-width: 1.75; stroke-linejoin: round; stroke-linecap: round; }
  .end { fill: var(--accent); stroke: var(--void); stroke-width: 2; }
  .halo { fill: var(--accent); opacity: 0.18; }
  .end-label { fill: var(--ink); font-size: 11.5px; font-family: var(--mono); font-weight: 500; }
  .crosshair { stroke: var(--hair-2); stroke-width: 1; stroke-dasharray: 3 3; display: none; }
  .focus { fill: var(--accent); stroke: var(--void); stroke-width: 2; display: none; }
  @media (prefers-reduced-motion: no-preference) {
    .line.draw { stroke-dasharray: var(--length); stroke-dashoffset: var(--length); animation: draw 1.1s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
    .area.draw { opacity: 0; animation: fade 0.6s 0.7s ease-out forwards; }
    .end.draw, .halo.draw, .end-label.draw { opacity: 0; animation: fade 0.4s 1.0s ease-out forwards; }
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fade { to { opacity: 1; } }
  .halo.draw { animation-name: fadeHalo; }
  @keyframes fadeHalo { to { opacity: 0.18; } }
  .empty { color: var(--faint); font-size: 11px; padding: 20px 0; }

  .tooltip {
    position: absolute; pointer-events: none; display: none; z-index: 2;
    background: var(--surface); border: 1px solid var(--hair-2);
    padding: 10px 12px; box-shadow: 0 16px 40px -14px rgba(0, 0, 0, 0.8); white-space: nowrap;
  }
  .tooltip b { display: block; font-size: 15px; font-weight: 500; color: var(--ink); }
  .tooltip span { color: var(--dim); font-size: 11px; }
  .tooltip .net { font-weight: 500; }

  .split { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 16px; align-items: start; }
  @media (min-width: 900px) { .split { grid-template-columns: 3fr 2fr; } }
  .habits { grid-template-columns: 1fr 1fr; margin: 0; }
  .habits .tile { grid-column: auto; }
  .habits .tile.wide { grid-column: span 2; }
  @media (max-width: 640px) { .habits { grid-template-columns: 1fr; } .habits .tile.wide { grid-column: auto; } }
  .pair { display: flex; gap: 28px; }
  .pair > div { min-width: 0; }
  .pair .note { margin-top: 4px; }

  .month { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 0 0 12px; }
  .month + .cal { margin-bottom: 22px; }
  .month h3 { font-family: var(--serif); font-weight: 500; font-size: 24px; color: var(--ink); margin: 0; letter-spacing: -0.01em; }
  .month span { color: var(--dim); font-size: 11px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr) 1.2fr; gap: 1px; background: var(--hair); border: 1px solid var(--hair); }
  .cal-head { background: var(--void); font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--faint); text-align: center; padding: 8px 0; }
  .cal-cell { min-height: 64px; padding: 7px 9px; display: flex; flex-direction: column; justify-content: space-between; background: var(--void); font-size: 11.5px; line-height: 1.3; min-width: 0; }
  .cal-cell.blank { background: var(--void-2); }
  .cal-cell.up { background: var(--up-ghost); }
  .cal-cell.down { background: var(--down-ghost); }
  .cal-cell.week { background: var(--surface); }
  .cal-d { color: var(--faint); font-size: 10px; }
  .cal-n { font-weight: 500; color: var(--ink); white-space: nowrap; }
  .up .cal-n { color: var(--up); }
  .down .cal-n { color: var(--down); }
  .cal-c { color: var(--dim); font-size: 10px; white-space: nowrap; }
  @media (max-width: 640px) {
    .cal-c { display: none; }
    .cal-cell { min-height: 48px; padding: 5px 5px; }
    .cal-n { font-size: 10.5px; }
  }

  .bar { display: flex; gap: 2px; height: 8px; margin: 14px 0; }
  .seg { min-width: 3px; }
  .seg.manual { background: var(--accent); }
  .seg.stop { background: var(--cat-stop); }
  .seg.target { background: var(--cat-target); }
  .legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; font-size: 11px; color: var(--dim); }
  .legend li { display: flex; align-items: center; gap: 9px; }
  .legend i { width: 8px; height: 8px; flex: none; }
  .legend b { color: var(--ink); font-weight: 500; }
  .legend .net { margin-left: auto; font-weight: 500; }

  .table-card { margin-top: 16px; padding: 20px 0 0; }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 22px; }
  .card-head h2 { margin: 0; }
  .written { font-size: 10.5px; color: var(--faint); }
  .scroll { overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 9px 14px; border-top: 1px solid var(--hair); white-space: nowrap; }
  th:first-child, td:first-child { padding-left: 22px; }
  th:last-child, td:last-child { padding-right: 22px; }
  th { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--faint); font-weight: 400; background: var(--surface); }
  td { color: var(--body); }
  tbody tr:hover td { background: var(--surface); }
  td.num, th.num { text-align: right; }
  td.up { color: var(--up); font-weight: 500; }
  td.down { color: var(--down); font-weight: 500; }
  td.none { color: var(--warn); }
  .side { display: inline-block; padding: 3px 7px; font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; border: 1px solid var(--hair-2); color: var(--dim); }
  .tag { display: inline-block; margin-left: 8px; padding: 2px 6px; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; background: var(--accent-ghost); color: var(--accent-hi); vertical-align: 1px; }

  /* A row is the way into a trade, so it says so on hover and takes a focus
     ring for the keyboard. The last column is the only part of the table that
     is yours rather than the broker's. */
  tbody tr.open { cursor: pointer; }
  tbody tr.open:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }
  td.mine { min-width: 104px; }
  /* A long tag is cut here rather than widening the table; the drawer shows it whole. */
  td.mine .chip { max-width: 104px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.mine > * { vertical-align: middle; }
  td.mine > * + * { margin-left: 7px; }
  td.mine .dot { display: inline-block; width: 5px; height: 5px; background: var(--accent); }
  td.mine .dot.off { background: none; }
  td.mine .invite { font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--faint); opacity: 0; transition: opacity 0.15s; }
  tbody tr:hover .invite, tbody tr:focus-visible .invite { opacity: 1; }
  /* Your tags, wherever they appear. Outlined, so they never read as the
     broker's own comment on the entry order, which is the filled chip above. */
  .chip { display: inline-block; padding: 2px 7px; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; border: 1px solid var(--hair-2); color: var(--body); vertical-align: 1px; }
  .chip.more { color: var(--faint); border-style: dashed; }

  /* The sign-in gate and the load's own messages. Layer 1 lives behind a
     login, so this is the first thing on the page until it is not needed. */
  [hidden] { display: none !important; }
  .meta { display: flex; align-items: baseline; gap: 16px; color: var(--faint); }
  .gate { display: flex; justify-content: center; padding: 48px 0; }
  form.signin { width: 100%; max-width: 340px; }
  form.signin label { display: block; font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--faint); margin-bottom: 14px; }
  form.signin input {
    display: block; width: 100%; margin-top: 7px; padding: 10px 12px;
    background: var(--surface); color: var(--ink); border: 1px solid var(--hair-2);
    font: 400 13px/1.4 var(--mono); letter-spacing: normal; text-transform: none;
  }
  form.signin input:focus { outline: none; border-color: var(--accent); }
  button {
    padding: 10px 18px; background: var(--accent); color: var(--accent-ink); border: 0;
    font: 500 10.5px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer;
  }
  button:hover { background: var(--accent-hi); }
  button.quiet { background: none; color: var(--faint); border: 1px solid var(--hair); padding: 6px 12px; }
  button.quiet:hover { background: var(--surface); color: var(--body); }
  .status { padding: 48px 0; text-align: center; color: var(--dim); font-size: 12px; }
  .status .error { color: var(--down); margin: 0 0 8px; }
  .status .hint { color: var(--faint); font-size: 11px; margin: 0 0 20px; max-width: 520px; margin-inline: auto; line-height: 1.6; }
  p.error { color: var(--down); font-size: 11px; margin: 0 0 14px; }

  /* ── One trade, opened up ──────────────────────────────────────────────
     The figures stay in mono, because they are the broker's. What you write
     is set in the serif the page saves for the things a person wrote, which
     is the whole reason a note looks different from a number here. */
  body.locked { overflow: hidden; }
  .drawer-backdrop { position: fixed; inset: 0; z-index: 8; background: rgba(8, 8, 7, 0.74); }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 9;
    width: min(640px, 100%);
    display: flex; flex-direction: column; outline: none;
    background: var(--void); border-left: 1px solid var(--hair-2);
    box-shadow: -50px 0 90px -50px rgba(0, 0, 0, 0.95);
  }
  #drawer-inner { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  @media (prefers-reduced-motion: no-preference) {
    .drawer { animation: slide 0.22s cubic-bezier(0.4, 0, 0.2, 1); }
    .drawer-backdrop { animation: fade 0.22s ease-out; }
  }
  @keyframes slide { from { transform: translateX(28px); opacity: 0; } }

  .drawer-head { flex: none; padding: 14px 24px 18px; background: var(--surface); border-bottom: 1px solid var(--hair); }
  .drawer-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .drawer-nav button { padding: 5px 11px; }
  .drawer-nav button:disabled { opacity: 0.35; cursor: default; }
  .drawer-nav button:disabled:hover { background: none; color: var(--faint); }
  .drawer-nav button:last-child { margin-left: auto; }
  .drawer-count { font-size: 10px; letter-spacing: 0.14em; color: var(--faint); }
  .drawer-id { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px 20px; flex-wrap: wrap; }
  .drawer-title { font: 500 15px/1.3 var(--mono); color: var(--ink); margin: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .drawer-title .tag { margin-left: 0; }
  .drawer-sub { color: var(--faint); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; margin: 9px 0 0; }
  .drawer-net { font-family: var(--serif); font-size: 38px; font-weight: 500; line-height: 1; letter-spacing: -0.02em; color: var(--ink); font-variant-numeric: proportional-nums; }
  .drawer-net.up { color: var(--up); }
  .drawer-net.down { color: var(--down); }

  .drawer-body { flex: 1; min-height: 0; overflow-y: auto; padding: 24px 24px 64px; }
  .drawer-body h3 { font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--faint); font-weight: 400; margin: 0 0 14px; }
  .drawer-body h3::before { content: ''; display: inline-block; width: 5px; height: 5px; background: var(--accent); margin-right: 9px; vertical-align: 1px; }

  .facts { display: grid; grid-template-columns: auto 1fr; gap: 9px 16px; margin: 0; font-size: 12px; }
  @media (min-width: 540px) { .facts { grid-template-columns: auto 1fr auto 1fr; } }
  .facts dt { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--faint); align-self: baseline; white-space: nowrap; }
  .facts dd { margin: 0; color: var(--body); }
  .facts dd.strong { color: var(--ink); font-weight: 500; }
  .facts dd.up { color: var(--up); }
  .facts dd.down { color: var(--down); }
  .facts dd.warn { color: var(--warn); }

  .exits { margin-top: 28px; }
  .exit-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; background: var(--hair); border: 1px solid var(--hair); }
  .exit-list li { background: var(--void); display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding: 9px 12px; font-size: 11.5px; }
  .exit-at { color: var(--faint); }
  .exit-lots { color: var(--ink); }
  .exit-why { color: var(--dim); }
  .exit-slip { margin-left: auto; font-size: 10.5px; }

  .margin { margin-top: 30px; border-top: 1px solid var(--hair); padding-top: 24px; }
  .margin-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .margin-head h3 { margin: 0; }
  .saved { font-size: 10px; letter-spacing: 0.08em; color: var(--faint); text-align: right; }
  .saved.working { color: var(--accent); }
  .saved.failed { color: var(--down); letter-spacing: normal; line-height: 1.5; }

  /* Tags: chips you click to edit as a line, with a hairline under the
     pointer as the only hint they need. */
  .chips {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    padding: 8px 11px; margin: 0 -12px 20px; min-height: 34px;
    border: 1px solid transparent; cursor: text;
  }
  .chips:hover { border-color: var(--hair); }
  .chips:focus-visible { outline: none; border-color: var(--hair-2); }
  .chip-empty { font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--faint); border: 1px dashed var(--hair-2); padding: 3px 8px; }
  /* The same inset as the chips it replaces, so clicking to write does not
     shift the words sideways under the pointer. */
  .tag-input {
    display: block; width: calc(100% + 24px); margin: 0 -12px 20px;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--accent); padding: 8px 11px;
    font: 400 13px/1.4 var(--mono);
  }
  .tag-input:focus { outline: none; }
  .tag-input::placeholder { color: var(--faint); }

  /* The note is one surface that is always the editor — framed like a field so
     it is plain you can write in it, with the toolbar along the top. What you
     type is drawn as what it means, so there is no second state to switch to. */
  .editor { margin: 0 -12px; border: 1px solid var(--hair); background: var(--void-2); }
  .editor:focus-within { border-color: var(--accent); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 2px; padding: 5px 6px; background: var(--surface); border-bottom: 1px solid var(--hair); }
  .tool {
    background: none; border: 0; color: var(--dim); cursor: pointer;
    padding: 4px 9px; min-width: 30px;
    font: 500 11.5px/1.4 var(--mono); letter-spacing: 0; text-transform: none;
  }
  .tool:hover { background: var(--surface-2); color: var(--ink); }
  .tool.on { background: var(--accent-ghost); color: var(--accent-hi); }

  .writing {
    position: relative; padding: 14px 13px; min-height: 170px; outline: none;
    font: 400 15px/1.75 var(--serif); color: var(--body); cursor: text;
  }
  .writing.vacant::before {
    content: attr(data-placeholder); position: absolute; pointer-events: none;
    color: var(--faint); font-style: italic;
  }
  .writing > :first-child { margin-top: 0; }
  .writing > :last-child { margin-bottom: 0; }
  .writing p { margin: 0 0 0.85em; }
  .writing h4 { font: 500 17px/1.35 var(--serif); color: var(--ink); margin: 1.3em 0 0.45em; letter-spacing: -0.01em; }
  .writing ul, .writing ol { margin: 0 0 0.85em; padding-left: 1.25em; }
  .writing li { margin-bottom: 0.25em; }
  .writing li::marker { color: var(--faint); }
  .writing blockquote { margin: 0 0 0.85em; padding-left: 14px; border-left: 2px solid var(--accent); color: var(--dim); font-style: italic; }
  .writing strong { color: var(--ink); font-weight: 600; }
  .writing code { font: 400 12.5px/1.5 var(--mono); background: var(--surface-2); color: var(--accent-hi); padding: 1px 5px; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Journal</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="meta">
      <span id="freshness"></span>
      <button type="button" class="quiet" id="signout" hidden>Sign out</button>
    </div>
  </header>

  <section class="gate" id="gate" hidden>
    <form class="card signin" id="signin">
      <h2>Sign in to read the record</h2>
      <label>Email
        <input type="email" id="email" autocomplete="username" required>
      </label>
      <label>Password
        <input type="password" id="password" autocomplete="current-password" required>
      </label>
      <p class="error" id="signin-error" hidden></p>
      <button type="submit" id="signin-button">Sign in</button>
    </form>
  </section>

  <section class="status" id="status" hidden></section>

  <div id="app" hidden>
    <section class="tiles" id="tiles"></section>
    <section class="card chart">
      <h2>Net P&amp;L, cumulative by trade</h2>
      <svg id="chart" viewBox="0 0 880 320" role="img" aria-label="Net profit and loss over time"></svg>
      <div class="tooltip" id="tooltip"></div>
    </section>
    <section class="split">
      <div class="card">
        <h2>By day</h2>
        <div id="calendar"></div>
      </div>
      <div class="tiles habits" id="habits"></div>
    </section>
    <section class="card table-card">
      <div class="card-head">
        <h2>Every trade, newest first</h2>
        <span class="written" id="written"></span>
      </div>
      <div class="scroll"><table id="table"></table></div>
    </section>
  </div>
</main>

<div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
<aside class="drawer" id="drawer" tabindex="-1" role="dialog" aria-modal="true" aria-label="Trade" hidden>
  <div id="drawer-inner"></div>
</aside>

<script type="module" src="./main.js"></script>
</body>
</html>
